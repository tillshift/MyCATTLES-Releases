<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>MyCATTLES Bridge</title></head>
<body>
<header class="top"><div class="brand-mark" aria-hidden="true">M</div><div class="brand-copy"><strong>MyCATTLES</strong><span>アドオン連携</span></div><div class="header-connection" aria-label="アプリ接続状態"><span id="connectionDot" class="dot idle" role="status" aria-label="接続を確認しています" tabindex="0" title="接続を確認しています"></span><button id="ping" class="icon-button" title="接続状態を再確認" aria-label="接続状態を再確認">↻</button></div></header>
<main>
<section class="section-heading"><div><h1>フォーム連携</h1><p>このページの情報を安全に取り込み・入力</p></div></section>
<section class="action-grid" aria-label="フォーム連携操作">
<button id="analyze" class="btn secondary action-tile" title="ページの入力欄を調べます。情報の取り込み・入力・送信は行いません。"><span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="12" height="14" rx="2"/><path d="M6 7h6M6 10h4"/><circle cx="16" cy="16" r="4"/><path d="m19 19 3 3"/></svg></span><span class="tile-label">フォームを解析</span></button>
<button id="capture" class="btn primary action-tile" title="現在のページの入力済み情報を取得し、アプリで確認します。保存する項目は後から選択できます。"><span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 17v3h16v-3"/></svg></span><span class="tile-label">入力済み情報を取り込む</span></button>
<button id="fill" class="btn primary action-tile" title="選択した情報を現在のページに入力します。送信ボタンは押しません。"><span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h4m4 1 2 2 4-4"/></svg></span><span class="tile-label">フォームに入力する</span></button>
</section>
<p class="footnote action-note">入力のみ実行します。サイトへの送信・登録は行いません。取り込み時は送信前に確認し、パスワード等は別途許可が必要です。</p>
<section class="result-panel"><div class="result-title"><h2>処理状況</h2><span id="statusBadge" class="status-badge">待機中</span></div><div id="step3status" role="status" aria-live="polite">操作を選ぶと、ここに結果が表示されます。</div></section>
<section class="analysis-panel"><div class="result-title"><h2>解析結果</h2><span class="mini-label">ページ内</span></div><div id="summary" aria-live="polite">まだ解析していません</div><div id="results"></div></section>
</main><footer>個人情報は操作時のみ取得します。通常の閲覧中は収集しません。</footer><script src="popup.js"></script></body></html>
