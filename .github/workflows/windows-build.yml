name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'windows/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows application
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display tool versions
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package release directory
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $releaseDir)) {
            throw "Windows release directory not found: $releaseDir"
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath 'MyCATTLES-Windows-x64.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCATTLES-Windows-x64
          path: MyCATTLES-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
